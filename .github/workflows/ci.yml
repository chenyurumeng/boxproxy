name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/app-scoped-dns-hijack
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  boxctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path boxctl/Cargo.toml --all -- --check

      - name: Run tests
        run: cargo test --manifest-path boxctl/Cargo.toml --all-targets
