name: Publish Runtime Tools

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string
      build_boxctl:
        description: Build and publish boxctl
        required: true
        default: true
        type: boolean
      build_boxbpf:
        description: Build and publish boxbpf
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: runtime-tools-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      BUILD_BOXCTL: ${{ inputs.build_boxctl }}
      BUILD_BOXBPF: ${{ inputs.build_boxbpf }}
      ANDROID_NDK_VERSION: 29.0.14206865
      ANDROID_API_LEVEL: 29
      TARGET: aarch64-linux-android

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        id: release
        shell: bash
        run: |
          set -eu
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          if [ "$BUILD_BOXCTL" != "true" ] && [ "$BUILD_BOXBPF" != "true" ]; then
            echo "Select at least one runtime tool to build." >&2
            exit 1
          fi
          printf 'version=%s\ntag=v%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"

      - name: Verify release tag is unused
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          ndk_root="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "$ndk_root"
          echo "ANDROID_NDK_ROOT=${ndk_root}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Set up Rust
        if: env.BUILD_BOXCTL == 'true'
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Verify Android Rust target
        if: env.BUILD_BOXCTL == 'true'
        shell: bash
        run: rustup target add "$TARGET" --toolchain 1.97.0

      - name: Build boxctl
        if: env.BUILD_BOXCTL == 'true'
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          android_clang="${TOOLCHAIN}/${TARGET}${ANDROID_API_LEVEL}-clang"
          android_clangxx="${TOOLCHAIN}/${TARGET}${ANDROID_API_LEVEL}-clang++"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$android_clang" \
          CC_aarch64_linux_android="$android_clang" \
          CXX_aarch64_linux_android="$android_clangxx" \
          AR_aarch64_linux_android="${TOOLCHAIN}/llvm-ar" \
            cargo build --manifest-path boxctl/Cargo.toml --release --target "$TARGET"
          install -Dm755 "boxctl/target/${TARGET}/release/boxctl" dist/boxctl-arm64-v8a

      - name: Build boxbpf
        if: env.BUILD_BOXBPF == 'true'
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          "${TOOLCHAIN}/${TARGET}${ANDROID_API_LEVEL}-clang" \
            -O2 -Wall -Wextra -fPIE -pie \
            boxbpf/main.c boxbpf/loader.c boxbpf/config.c \
            -o dist/boxbpf-arm64-v8a
          chmod 755 dist/boxbpf-arm64-v8a

      - name: Create checksums and build metadata
        shell: bash
        run: |
          set -eu
          assets=()
          [ -f dist/boxctl-arm64-v8a ] && assets+=(boxctl-arm64-v8a)
          [ -f dist/boxbpf-arm64-v8a ] && assets+=(boxbpf-arm64-v8a)
          [ "${#assets[@]}" -gt 0 ]
          (
            cd dist
            sha256sum "${assets[@]}" > SHA256SUMS
            {
              echo "version=${{ steps.release.outputs.version }}"
              echo "source_commit=${GITHUB_SHA}"
              echo "target=${TARGET}"
              echo "android_api_level=${ANDROID_API_LEVEL}"
            } > BUILD_INFO
          )

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: BoxProxy Tools ${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: dist/*
